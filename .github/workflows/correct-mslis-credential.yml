name: Verify published MSLIS credential
on:
  push:
    branches: [automation/mslis-credential-correction]
    paths: [.github/workflows/correct-mslis-credential.yml]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify corrected credential on live website
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import time
          from urllib.request import Request, urlopen
          paths = ['', 'authors-desk.html', 'research-room.html', 'preview.html']
          def check(path):
              url = 'https://readingroompress.com/' + path + '?credential=mslis-df2a7358'
              with urlopen(Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'ReadingRoomPress-CredentialCheck/1.0'}), timeout=15) as response:
                  data = response.read()
                  assert response.status == 200, path
                  assert b'Sara Mautino, MSLIS' in data, ('Corrected credential missing', path)
                  assert b'Sara Mautino, MSLS' not in data, ('Old credential still present', path)
                  return {'page': path or '/', 'status': response.status, 'MSLIS_occurrences': data.count(b'Sara Mautino, MSLIS'), 'old_credential_occurrences': data.count(b'Sara Mautino, MSLS')}
          for attempt in range(8):
              try:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                      report = list(pool.map(check, paths))
                  print(json.dumps({'passed':True, 'live_pages':report}, indent=2))
                  break
              except Exception as exc:
                  print('Attempt', attempt+1, str(exc), flush=True)
                  if attempt == 7:
                      raise
                  time.sleep(10)
          PY
