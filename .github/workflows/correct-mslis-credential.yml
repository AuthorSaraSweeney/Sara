name: Correct MSLIS credential
on:
  push:
    branches: [automation/mslis-credential-correction]
    paths: [.github/workflows/correct-mslis-credential.yml]
permissions:
  contents: write
jobs:
  prepare-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cfbc53c3aeaa9a7d7229b06dbae9da3edaed4e39
          fetch-depth: 1
      - name: Replace only the credential in pages, preview, and its source template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          old = b'Sara Mautino, MSLS'
          new = b'Sara Mautino, MSLIS'
          expected = {'index.html', 'authors-desk.html', 'research-room.html', 'preview.html', 'tools/build_reading_room_home.py'}
          report = {}
          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not name:
                  continue
              path = Path(name)
              if path.suffix not in {'.html', '.py', '.md', '.json', '.yml', '.yaml', '.css', '.js'}:
                  continue
              data = path.read_bytes()
              count = data.count(old)
              if count:
                  assert name in expected, ('Unexpected occurrence', name)
                  corrected = data.replace(old, new)
                  assert corrected.replace(new, old) == data, ('Unexpected edit', name)
                  path.write_bytes(corrected)
                  assert old not in corrected
                  report[name] = count
          assert set(report) == expected, report
          for name in expected:
              data = Path(name).read_bytes()
              assert new in data and old not in data, name
          print(json.dumps({'passed': True, 'only_change': 'Sara Mautino, MSLS to Sara Mautino, MSLIS', 'replacements': report}, indent=2))
          PY
      - name: Commit correction on a separate branch
        run: |
          git switch -c fix/mslis-credential
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html authors-desk.html research-room.html preview.html tools/build_reading_room_home.py
          git commit -m "Correct Sara Mautino credential to MSLIS throughout website and preview"
          git push origin HEAD:refs/heads/fix/mslis-credential
          git log -1 --format='%H'
