name: Next novel draft preview
on:
  push:
    branches: ['draft/next-novel-teaser']
    paths: ['tools/build_next_novel_teaser.py', '.github/workflows/next-novel-draft.yml']
permissions:
  contents: write
concurrency:
  group: reading-room-next-novel-draft
  cancel-in-progress: false
jobs:
  build-and-check:
    if: github.ref == 'refs/heads/draft/next-novel-teaser'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/next-novel-teaser
      - name: Install build and browser checks
        run: python3 -m pip install beautifulsoup4 playwright
      - name: Build draft teaser
        run: python3 tools/build_next_novel_teaser.py
      - name: Check navigation, responsive layouts, and preserved details
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          output = Path('next-novel-review')
          output.mkdir(exist_ok=True)
          server = subprocess.Popen(['python3','-m','http.server','8765','--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          results = []
          try:
              with sync_playwright() as p:
                  executable = shutil.which('google-chrome') or shutil.which('chromium')
                  browser = p.chromium.launch(headless=True, executable_path=executable) if executable else p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width':1440,'height':1000})
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/preview.html#upcoming',wait_until='networkidle')
                  page.evaluate('document.fonts.ready')
                  for width in [1440,1024,900,768,720,390,360,320]:
                      page.set_viewport_size({'width':width,'height':1000})
                      for view in ['home','upcoming','authors','research','shelf']:
                          page.locator('button[data-page="'+view+'"]').click()
                          page.wait_for_timeout(70)
                          dimensions = page.evaluate('({width:innerWidth,scroll:document.documentElement.scrollWidth,visible:[...document.querySelectorAll(".preview-page")].filter(e=>!e.hidden).map(e=>e.id)})')
                          assert dimensions['visible'] == [view], (width,view,dimensions)
                          assert dimensions['scroll'] <= width+1, ('Horizontal overflow',width,view,dimensions)
                          if view == 'upcoming':
                              cards = page.locator('#upcoming .next-character').evaluate_all('(es)=>es.map(e=>{let b=e.getBoundingClientRect();let h=e.querySelector("h3").getBoundingClientRect();return {top:b.y,bottom:b.bottom,title:h.y}})')
                              if width > 760:
                                  assert abs(cards[0]['top']-cards[1]['top']) < 1
                                  assert abs(cards[0]['bottom']-cards[1]['bottom']) < 1
                                  assert abs(cards[0]['title']-cards[1]['title']) < 1
                              if width in [1440,390]:
                                  page.screenshot(path=str(output/('teaser-'+str(width)+'.png')),full_page=True)
                          if view == 'home' and width in [1440,390]:
                              page.locator('#home #next-novel').screenshot(path=str(output/('homepage-teaser-'+str(width)+'.png')))
                          results.append({'width':width,'view':view,'overflow':dimensions['scroll']-width})
                  page.set_viewport_size({'width':1440,'height':1000})
                  page.locator('button[data-page="home"]').click()
                  page.locator('#home #next-novel a').click()
                  assert page.locator('#upcoming').is_visible()
                  page.locator('#upcoming .next-backlink').click()
                  assert '#home/next-novel' in page.url
                  page.locator('button[data-page="upcoming"]').click()
                  page.locator('#upcoming .next-status a').click()
                  assert '#home/featured-book' in page.url
                  page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded')
                  assert page.locator('body').inner_text().count('Sara Mautino, MSLIS') >= 1
                  page.locator('#next-novel a').click()
                  assert page.url.endswith('/next-novel.html')
                  assert page.locator('#upcoming-title').is_visible()
                  page.locator('.next-backlink').click()
                  assert page.url.endswith('index.html#next-novel')
                  assert not errors, errors
                  browser.close()
              Path('next-novel-review/checks.json').write_text(json.dumps({'passed':True,'responsive_checks':results,'browser_errors':errors},indent=2))
              print('PASS: 40 responsive views, aligned character cards, homepage-to-teaser navigation, return links, and MSLIS preservation.')
          finally:
              server.terminate()
          PY
      - name: Commit tested pages to the draft branch only
        run: |
          test "$(git branch --show-current)" = "draft/next-novel-teaser"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html next-novel.html next-novel.css preview.html tools/build_reading_room_home.py next-novel-build-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add tested homepage teaser and upcoming mafia romance page'
            git push origin HEAD:draft/next-novel-teaser
          fi
          git log -1 --format='%H'
      - name: Save draft and screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-novel-preview-review
          path: |
            index.html
            next-novel.html
            next-novel.css
            reading-room-services.css
            reading-room-home.css
            research-packages.css
            preview.html
            next-novel-build-report.json
            next-novel-review/
          retention-days: 7
